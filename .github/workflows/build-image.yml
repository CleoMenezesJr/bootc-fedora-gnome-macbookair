name: Build and Push Bootc Image

on:
  schedule:
    # Daily at 02:00 UTC (22:00 Chile time)
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_IMAGE: localhost/bootc-build:latest
  CHUNKED_IMAGE: localhost/bootc-chunked:latest

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          # Build image, its podman copy and the rechunked copy need ~20 GB
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Extract base image
        id: base
        run: |
          echo "image=$(sed -n 's/^ARG BASE_IMAGE=//p' Containerfile)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^ARG FEDORA_VERSION=//p' Containerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate timestamp (Chile time)
        id: timestamp
        run: echo "date=$(TZ='America/Santiago' date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.base.outputs.version }}-${{ steps.timestamp.outputs.date }}
            type=raw,value=${{ steps.base.outputs.version }}-latest
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Build image (full rebuild)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          push: false
          pull: true
          no-cache: true
          tags: ${{ env.BUILD_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Rechunk image
        run: |
          # Split the image into reproducible, package-based layers so
          # `bootc upgrade` only downloads what actually changed.
          sudo podman pull "docker-daemon:${BUILD_IMAGE}"
          docker rmi "${BUILD_IMAGE}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            "${{ steps.base.outputs.image }}:${{ steps.base.outputs.version }}" \
            /usr/libexec/bootc-base-imagectl rechunk "${BUILD_IMAGE}" "${CHUNKED_IMAGE}"

      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          AUTH_FILE: ${{ runner.temp }}/auth/config.json
        run: |
          mkdir -p "$(dirname "${AUTH_FILE}")"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login --authfile "${AUTH_FILE}" "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          while read -r tag; do
            if [ -n "${tag}" ]; then
              sudo podman push --authfile "${AUTH_FILE}" "${CHUNKED_IMAGE}" "docker://${tag}"
            fi
          done <<< "${TAGS}"
